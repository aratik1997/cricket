    <rect x="29" y="10" width="6" height="26" rx="2" fill="url(#willow)" stroke="#7a5a22" stroke-width="1"/>
    <rect x="27.5" y="34" width="9" height="16" rx="4" fill="#efe0b8" stroke="#7a5a22" stroke-width="1.2"/>
    <rect x="29.3" y="36" width="5.4" height="12" rx="2.5" fill="none" stroke="#c99a3f" stroke-width="0.8"/>
  </g>

  <!-- ball -->
  <circle cx="42" cy="24" r="9" fill="#c0392b" stroke="#7a231a" stroke-width="1.2"/>
  <path d="M37 19 Q42 24 37 29" fill="none" stroke="#eef3ee" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M47 19 Q42 24 47 29" fill="none" stroke="#eef3ee" stroke-width="1.3" stroke-linecap="round"/>
